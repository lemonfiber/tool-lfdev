# Dependency updates (spec ADR-0016).
#
# The tool is written against Python's standard library alone (REPO-R74), so
# the workflows' actions are the only dependencies there are to watch. The
# pull requests it opens cite nothing; `spec_check.py` supplies `GOV-R12` for a
# pull request GitHub says `dependabot[bot]` opened (Q-R55).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      include: scope
    # A release waits three days before it is offered, the shared gates apart:
    # a repo running a stale gate is the failure this grouping exists to
    # prevent. Security updates are never subject to cooldown.
    cooldown:
      default-days: 3
      exclude: ["lemonfiber/spec*"]
    groups:
      shared-workflows:
        patterns: ["lemonfiber/spec*"]
      # CodeQL refuses a run whose `init` and `analyze` are different
      # revisions of one action, so they move together, majors included.
      codeql:
        patterns: ["github/codeql-action*"]
        update-types: ["major", "minor", "patch"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["lemonfiber/spec*"]
        update-types: ["minor", "patch"]
