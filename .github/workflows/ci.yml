# Every pull request here meets the organisation's shared gates, and the tool's
# own: ruff, and the unit tests at 100% line and branch coverage (REPO-R78).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  spec-check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
  workflow-pins:
    uses: lemonfiber/spec/.github/workflows/workflow-pins.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
  attribution:
    uses: lemonfiber/spec/.github/workflows/attribution.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
  commitlint:
    if: github.event_name == 'pull_request'
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
  labeler:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
  tests:
    name: tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      # The tool itself installs nothing (REPO-R74); these two only check it.
      - name: Install the linter and the coverage tool, as wheels
        run: pip install --disable-pip-version-check --only-binary ':all:' ruff==0.16.4 coverage==7.15.2
      - name: Formatting and lint
        run: ruff format --check . && ruff check .
      - name: The suite, at 100% line and branch coverage
        env:
          PYTHONPATH: src
        run: |
          coverage run -m unittest discover -s tests -t .
          coverage report --fail-under=100
