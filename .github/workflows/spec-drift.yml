# The copy of spec's scripts, held to its commit and to spec's main. The comparison is spec's shared `upstream-drift` (Q-R68,
# Q-R70), which writes what it found and the command that takes it to the run's
# summary as well as the log.
name: spec-drift
on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, as the floor: a pull request is what usually asks the question.
    - cron: "30 7 * * 1"
permissions:
  contents: read
# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  spec-drift:
    uses: lemonfiber/spec/.github/workflows/upstream-drift.yml@c7c9518ba96b3f75119bdf1646577ddeea28dc88 # v1.0.88
    with:
      lock: "vendored"
      upstream: "spec"
      revision: "src/lfdev/vendored/REVISION"
      copies: |
        scripts/status_check.py:src/lfdev/vendored/status_check.py
        scripts/what_is_blocking.py:src/lfdev/vendored/what_is_blocking.py
        scripts/catalogue.py:src/lfdev/vendored/catalogue.py
        scripts/integrity.py:src/lfdev/vendored/integrity.py
        scripts/metafm.py:src/lfdev/vendored/metafm.py
        scripts/paths.py:src/lfdev/vendored/paths.py
        scripts/patterns.py:src/lfdev/vendored/patterns.py
      remedy: "run `python -m lfdev.vendored_spec sync {head}` and commit src/lfdev/vendored"
