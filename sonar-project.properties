# Read by the SonarQube Cloud scan `sonar.yml` runs, which analyses this tree and
# reads the coverage report its `coverage` job wrote.
sonar.projectKey=lemonfiber_tool-lfdev
sonar.organization=lemonfiber

# `tests/` is the suite, named so the rules Sonar scopes to production code stay
# pointed at `src/`. A file claimed as both source and test is indexed twice and
# the analysis produces nothing, so `tests/` is also excluded from the sources.
sonar.sources=.
sonar.tests=tests
sonar.python.version=3.12

# `scripts/no_open_codeql_alert.py` is the spec's shared gate, byte-identical to
# its home copy and analysed there.
sonar.exclusions=tests/**,scripts/no_open_codeql_alert.py

# The coverage report is named by `sonar.yml`, which passes the scanner its path
# outside the workspace. It is written by the `coverage` job, the run that holds
# the suite to 100% line and branch coverage.
